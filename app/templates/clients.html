{% extends "base.html" %}

{% block content %}
<div class="border p-2" style="margin-top: -70px;">
    <button class="btn btn-success" onclick="showForm('client-form')">
        <i class="fas fa-plus"></i> Create Client
    </button>
</div>


<!-- Hidden Client Form -->
<div id="client-form" class="card shadow p-4" style="display: none; max-width: 700px; margin-top: -40px; margin-left: auto; margin-right: auto;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Create Client Form</h5>
        <button type="button" class="btn-close" aria-label="Close" onclick="hideForm('client-form')"></button>
    </div>

    <form action="/createClient" method="POST" enctype="multipart/form-data">
        <!-- Name -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Name<span class="text-danger">*</span></label>
            </div>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="name" required placeholder="Full Name">
            </div>
        </div>

        <!-- Mobile -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Mobile<span class="text-danger">*</span></label>
            </div>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="mobile" required placeholder="Mobile Number">
            </div>
        </div>

        <!-- Email -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Email</label>
            </div>
            <div class="col-sm-9">
                <input type="email" class="form-control" name="email" placeholder="Email (optional)">
            </div>
        </div>

        <!-- NID -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">NID<span class="text-danger">*</span></label>
            </div>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="nid" required placeholder="NID Number">
            </div>
        </div>

        <!-- Image -->
        <div class="row mb-3 align-items-center">
    <div class="col-sm-3 text-start">
      <label class="form-label mb-0">Image</label>
    </div>
    <div class="col-sm-9">
      <input type="file" class="form-control" name="image">
    </div>
  </div>

        <!-- Emergency Contact -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Emergency Contact</label>
            </div>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="emergency_contact" placeholder="Emergency Contact Number">
            </div>
        </div>

        <!-- Present Address -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Present Address</label>
            </div>
            <div class="col-sm-9">
                <textarea class="form-control" name="present_address" rows="2" placeholder="Present Address"></textarea>
            </div>
        </div>

        <!-- Permanent Address -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Permanent Address</label>
            </div>
            <div class="col-sm-9">
                <textarea class="form-control" name="permanent_address" rows="2" placeholder="Permanent Address"></textarea>
            </div>
        </div>

        <!-- Nominee Name -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Nominee Name</label>
            </div>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="nominee_name" placeholder="Nominee Name">
            </div>
        </div>

        <!-- Nominee NID -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Nominee NID</label>
            </div>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="nominee_nid" placeholder="Nominee NID">
            </div>
        </div>

        <!-- Nominee Mobile -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Nominee Mobile</label>
            </div>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="nominee_mobile" placeholder="Nominee Mobile Number">
            </div>
        </div>

        <!-- Status -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Status<span class="text-danger">*</span></label>
            </div>
            <div class="col-sm-9">
                <select class="form-select" name="status" required>
                    <option value="">Select Status</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="row mt-3">
            <div class="col-sm-9 offset-sm-3">
                <button type="submit" class="btn btn-success w-100">Register</button>
            </div>
        </div>
    </form>
</div>



{% endblock %}
