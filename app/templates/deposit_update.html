{% extends "base.html" %}

{% block content %}
<div class="card shadow mx-auto" style="max-width: 700px; padding: 1.5rem; margin-top: -30px;">
    <button type="button" class="btn-close position-absolute" style="top: 10px; right: 10px;" aria-label="Close"
        onclick="loadContent('/deposits')"></button>
    <h5 class="mb-3">Update Deposit</h5>

    <form method="POST" action="{{ url_for('bp.update_deposit_post') }}" enctype="multipart/form-data">
        <input type="hidden" name="deposit_id" value="{{ deposit.id }}">
        <!-- Client ID -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Client ID<span class="text-danger">*</span></label>
            </div>
            <div class="col-sm-9">
                <input type="number" name="client_id" class="form-control" value="{{ deposit.client_id }}" required {%
                    if current_user.user_type=='Client' %}readonly{% endif %}>
            </div>
        </div>

        <!-- Month -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Month<span class="text-danger">*</span></label>
            </div>
            <div class="col-sm-9">
                <input type="month" name="month" class="form-control" value="{{ deposit.month }}" required>
            </div>
        </div>

        <!-- Date -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Date<span class="text-danger">*</span></label>
            </div>
            <div class="col-sm-9">
                <input type="date" name="date" class="form-control" value="{{ deposit.date }}" required>
            </div>
        </div>

        <!-- Amount -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Amount<span class="text-danger">*</span></label>
            </div>
            <div class="col-sm-9">
                <input type="number" step="0.01" name="amount" class="form-control" value="{{ deposit.amount }}"
                    required>
            </div>
        </div>

        <!-- Comments -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Comments</label>
            </div>
            <div class="col-sm-9">
                <textarea name="comments" class="form-control" rows="2">{{ deposit.comments or '' }}</textarea>
            </div>
        </div>

        <!-- Existing File -->
        {% if deposit.file %}
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Current File</label>
            </div>
            <div class="col-sm-9">
                <a href="{{ url_for('static', filename='uploads/' + deposit.file) }}" target="_blank"
                    class="btn btn-sm btn-outline-info">
                    View File
                </a>
            </div>
        </div>
        {% endif %}

        <!-- Upload New File -->
        <div class="row mb-3 align-items-center">
            <div class="col-sm-3 text-start">
                <label class="form-label mb-0">Replace File</label>
            </div>
            <div class="col-sm-9">
                <input type="file" name="file" class="form-control" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx">
            </div>
        </div>

        <!-- Submit -->
        <div class="row mt-3">
            <div class="col-sm-9 offset-sm-3">
                <button type="submit" class="btn btn-primary w-100">Update Deposit</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
