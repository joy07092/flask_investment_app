<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark d-flex justify-content-center align-items-center vh-100" style="font-family: Arial, sans-serif;">
    <div class="card p-4 shadow-lg border-primary" style="width: 350px;">

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-3">
              {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        <!-- End Flash Messages -->

        <div class="text-center mb-4">
            <h3 class="text-dark mb-1">Welcome Back!</h3>
            <h5 class="text-muted">Please login to continue</h5>
        </div>

        <form method="POST" action="{{ url_for('bp.login_post') }}">
            <div class="mb-3 position-relative">
                <input type="text" name="username" class="form-control ps-5" placeholder="Username" required>
                <img src="{{ url_for('static', filename='images/user_icon.png') }}" class="position-absolute" style="top: 50%; left: 10px; transform: translateY(-50%); width: 18px; opacity: 0.7;" alt="User Icon">
            </div>

            <div class="mb-3 position-relative">
                <input type="password" name="password" class="form-control ps-5" placeholder="Password" required>
                <img src="{{ url_for('static', filename='images/password_icon.png') }}" class="position-absolute" style="top: 50%; left: 10px; transform: translateY(-50%); width: 18px; opacity: 0.7;" alt="Password Icon">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="remember" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <a href="#" class="text-primary text-decoration-none">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
